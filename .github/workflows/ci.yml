name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_matrix:
    name: test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.19.0
          - os: ubuntu-latest
            node-version: 26
          - os: macos-latest
            node-version: 22.19.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts --include=optional
      - run: npm audit --omit=dev
      - run: npm audit signatures
      - run: npm run ci
      - run: git diff --check

  dependency_review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject vulnerable dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
      - name: Preserve the aggregate gate on main pushes
        if: github.event_name != 'pull_request'
        run: ':'

  test:
    name: test
    if: ${{ always() }}
    needs: [test_matrix, dependency_review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every merge gate
        env:
          MATRIX_RESULT: ${{ needs.test_matrix.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
        run: |
          if [ "$MATRIX_RESULT" != success ] || [ "$DEPENDENCY_REVIEW_RESULT" != success ]; then
            printf 'test_matrix=%s dependency_review=%s\n' "$MATRIX_RESULT" "$DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi
