name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test_matrix:
    name: test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.19.0
          - 26
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts --include=optional
      - run: npm audit --omit=dev
      - run: npm audit signatures
      - run: npm run ci
      - run: git diff --check

  test:
    name: test
    if: ${{ always() }}
    needs: test_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete test matrix
        env:
          MATRIX_RESULT: ${{ needs.test_matrix.result }}
        run: test "$MATRIX_RESULT" = success
